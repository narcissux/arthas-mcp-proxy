services:
  arthas-mcp-proxy:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PIP_SOURCE: auto
        PIP_INDEX_URL: https://mirrors.aliyun.com/pypi/simple
        PIP_TRUSTED_HOST: mirrors.aliyun.com
    container_name: arthas-mcp-proxy
    ports:
      - "8000:8000"
    environment:
      - SSH_IDLE_TIMEOUT=300
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8000
      - LOG_LEVEL=INFO
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
