name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Ruff check
        run: ruff check src/ tests/

      - name: Ruff format check
        run: ruff format --check src/ tests/

      - name: Mypy type check
        run: mypy --show-error-codes src/arthas_mcp_proxy

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Run unit tests
        run: pytest -v --ignore=tests/integration/ --cov=arthas_mcp_proxy --cov-report=xml --cov-report=term

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  # ------------------------------------------------------------------
  # Integration tests against a Docker test target
  # Uses docker-compose.test.yml which ships with the repo.
  # ------------------------------------------------------------------
  integration:
    runs-on: ubuntu-latest
    needs: [lint, test]
    # Only run integration on main branch pushes (not every PR)
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          pip install -e ".[dev]"

      - name: Start Docker test target
        run: |
          docker compose -f docker-compose.test.yml up --build -d
          # Wait longer for container build + SSH startup
          sleep 30
          # Wait for SSH to be ready
          for i in $(seq 1 90); do
            if nc -z localhost 2222; then
              echo "SSH ready on port 2222"
              break
            fi
            echo "Waiting for SSH... ($i/90)"
            sleep 2
          done
          # Debug: show container status
          docker compose -f docker-compose.test.yml ps
          docker logs arthas-test-target 2>/dev/null || true

      - name: Run integration tests
        run: |
          pytest tests/integration/ -m integration -v --tb=short --docker-target

      - name: Tear down Docker test target
        if: always()
        run: |
          docker compose -f docker-compose.test.yml down --volumes
