name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Ruff check
        run: |
          if ! ruff check src/ tests/ --output-format=github; then
            echo "=== RUFF DETAILED OUTPUT ==="
            ruff check src/ tests/ --output-format=text
            exit 1
          fi

      - name: Ruff format check
        run: ruff format --check src/ tests/

      - name: Mypy type check
        run: mypy --show-error-codes src/arthas_mcp_proxy

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Run unit tests
        run: pytest -v --ignore=tests/integration/ --cov=arthas_mcp_proxy --cov-report=xml --cov-report=term

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  # ------------------------------------------------------------------
  # Integration tests against a Docker test target
  # Uses docker-compose.test.yml which ships with the repo.
  # Marked continue-on-error: true so it does not block CI while we
  # stabilise the containerised test environment.
  # ------------------------------------------------------------------
  integration:
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.ref == 'refs/heads/main'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          pip install -e ".[dev]"

      - name: Build and start test target
        run: |
          # Detect docker compose command (v2 plugin vs v1 standalone)
          if docker compose version >/dev/null 2>&1; then
            COMPOSE="docker compose"
          elif docker-compose version >/dev/null 2>&1; then
            COMPOSE="docker-compose"
          else
            echo "No docker compose found, skipping"
            exit 0
          fi
          echo "Using: $COMPOSE"
          $COMPOSE -f docker-compose.test.yml up --build -d
          echo "=== Container status ==="
          $COMPOSE -f docker-compose.test.yml ps
          echo "=== Waiting for SSH... ==="
          sleep 15
          for i in $(seq 1 60); do
            if nc -z localhost 2222; then
              echo "SSH ready on port 2222"
              break
            fi
            echo "Waiting... ($i/60)"
            sleep 2
          done
          echo "=== Container logs ==="
          docker logs arthas-test-target 2>&1 || true

      - name: Run integration tests
        run: |
          pytest tests/integration/ -m integration -v --tb=short --docker-target

      - name: Tear down
        if: always()
        run: |
          if docker compose version >/dev/null 2>&1; then
            docker compose -f docker-compose.test.yml down --volumes || true
          elif docker-compose version >/dev/null 2>&1; then
            docker-compose -f docker-compose.test.yml down --volumes || true
          fi
